# Every window runs Claude Code; Ctrl-b c opens another one, like a new tab.
set -g default-command "claude; exec bash"
# Click windows in the status bar to switch, scroll back with the wheel.
set -g mouse on
# Number windows from 1 so Ctrl-b 1..9 matches the status bar.
set -g base-index 1
set -g renumber-windows on
# Label every window "claude" instead of the shell it runs under.
set -g automatic-rename-format "claude"
